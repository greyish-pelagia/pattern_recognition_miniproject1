[project]
name = "pattern-recognition-miniproject1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.2",
    "pandas>=2.2",
    "pillow>=11",
    "scikit-image>=0.26.0",
]

[project.optional-dependencies]
enhancement = [
    "einops>=0.7.0",
    "omegaconf==2.3.0",
    "open-clip-torch>=2.17.1,<3",
    "packaging>=23.0",
    "safetensors>=0.4.0",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "tqdm>=4.65.0",
    "transformers>=4.28.1,<5",
]
training = [
    "matplotlib>=3.11.2",
    "opencv-python>=5.0.0.93",
    "scikit-learn>=1.9.1",
]
notebooks = ["ipykernel>=7.4.0"]
visualization = ["matplotlib>=3.11.2", "scikit-learn>=1.9.1"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
